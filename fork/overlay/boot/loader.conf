# NexBSD — /boot/loader.conf
#
# POURQUOI CE FICHIER EXISTE (C-51, 2026-10-30)
# L'image publiee dans la Release `image-18` ne demarrait pas. Apres mesure du disque :
#   - aucune chaine d'amorcage (le premier secteur de la slice etait entierement a zero) ;
#   - et AUCUN /etc/fstab dans l'image : le noyau n'avait aucune instruction pour la racine.
# Le second point se corrige ici et dans /etc/fstab.
#
# La racine est designee par l'ETIQUETTE GPT, jamais par un nom de peripherique.
#   /dev/gpt/rootfs ne change pas ; /dev/ada0s1a change des qu'on change de machine,
#   de controleur (ada, da, vtbd) ou de table de partitions. Une image qui ne demarre
#   que sur la machine qui l'a fabriquee n'est pas une image : c'est une photo.
vfs.root.mountfrom="ufs:/dev/gpt/rootfs"

# Trois secondes pour voir le menu de demarrage. Sans cela, un echec defile trop vite
# pour etre lu, et on ne peut pas entrer dans le loader pour diagnostiquer.
autoboot_delay="3"

# Le logo FreeBSD est retire : le produit s'appelle NexBSD, pas FreeBSD.
loader_logo="none"

# Le noyau du produit. Un seul noyau est installe : NEXBSD_L1 (fork/sys/amd64/conf/NEXBSD_L1).
kern.module_path="/boot/kernel;/boot/modules"
