# NexBSD — /etc/pf.conf du produit
#
# ORIGINE : règles écrites et PROUVÉES dans la VM du banc le 2026-10-27 (T-05, T-05a).
#   - refus par défaut journalisé, observé depuis une AUTRE machine (Mint) : 8 SYN vers un port
#     non déclaré → « rule 0/0(match): block in on vtnet0 » dans pflog ;
#   - port déclaré (445) traversé par un client SMB réel depuis la même autre machine.
#   Compte rendu : tests/results/T-05-pare-feu.md et T-05a-accessibilite-depuis-mint.md
#
# STATUT DANS LE PRODUIT : fichier de référence. Il n'est PAS encore installé par une chaîne de
# release (aucune image NexBSD n'existe — jalon J5). Tant que ce n'est pas le cas, il ne faut
# pas dire que NexBSD applique ces règles : il les appliquera quand l'image les portera.
#
# F-1 (à trancher au moment de l'installation) : le nom de l'interface n'est pas connu à l'avance
# sur du matériel réel (vtnet0 en virtio, em0/re0 en réel). La macro IFACE ci-dessous doit être
# renseignée par l'installeur, ou remplacée par une détection. NE PAS livrer avec « vtnet0 » figé.

IFACE = "vtnet0"

# --- boucle locale : ne pas filtrer, les services se parlent entre eux
set skip on lo0

# --- normalisation : empêche la fragmentation évasive
scrub in all

# --- RÈGLE PAR DÉFAUT : on refuse tout ce qui entre, ET on le journalise
#     (le journal est la contrepartie obligatoire : un refus non tracé n'est pas vérifiable)
block in log all

# --- sorties autorisées : mises à jour, fetch, DNS, NTP
pass out all keep state

# --- ICMP echo : savoir si la machine est vivante. C-23 : « max 20/s » n'existe pas en pf
#     (« max » désigne un nombre d'états, pas un débit) → simple keep state.
pass in on $IFACE inet proto icmp icmp-type echoreq keep state
# --- ICMP indispensable au bon fonctionnement de TCP (PMTU) : on ne le bloque pas
pass in on $IFACE inet proto icmp icmp-type unreach keep state
pass in on $IFACE inet proto icmp icmp-type timex keep state

# --- SMB : le service de fichiers (prouvé T-03, T-04-F, T-04-G, T-05a)
pass in on $IFACE inet proto tcp to port 445 keep state

# --- NetBIOS : nécessaire pour qu'un client Windows RÉEL trouve le serveur (T-15, T-09 à venir)
pass in on $IFACE inet proto tcp to port 139 keep state
pass in on $IFACE inet proto udp to port { 137, 138 } keep state

# --- LDAP : l'annuaire. RESTREINT À LA BOUCLE LOCALE : les identités ne sont pas exposées au réseau.
#     Pour ouvrir à un réseau de laboratoire déclaré, décommenter et adapter la source :
# pass in on $IFACE inet proto tcp from 192.168.122.0/24 to port 389 keep state
pass in on lo0 inet proto tcp to port 389 keep state

# --- SSH : administration
pass in on $IFACE inet proto tcp to port 22 keep state
