# NexBSD — /etc/sysctl.conf du produit
#
# ORIGINE : C-48 du 2026-10-29. Le contrôle de durcissement (scripts/75) signalait « aucun
# sysctl.conf : pas de durcissement du noyau ». Une affiche « Linux Security Toolkit » envoyée par
# le responsable a posé la bonne question (« que fait SELinux, Grsecurity, AppArmor ? ») et y a
# répondu par l'équivalent FreeBSD : le cadre MAC, Capsicum et **ces réglages de noyau**.
#
# STATUT : fichier de référence du produit. Il n'est PAS encore installé par une chaîne de release
# (aucune image NexBSD n'a encore démarré). Les réglages ci-dessous sont ceux que la documentation
# FreeBSD recommande sur 14.x et 15.0 ; AUCUN n'a été éprouvé sur le produit NexBSD lui-même.
# C'est une distinction importante : ce fichier est *écrit d'après la référence*, pas *validé*.
#
# PRINCIPE : chaque ligne doit tenir dans une phrase. Si on ne sait pas expliquer un réglage,
# on ne le met pas — un durcissement incompris sera désactivé au premier incident.

# --- invisibilité entre utilisateurs ---------------------------------------
# Sans cela, tout utilisateur peut lister les processus des autres : savoir qui fait tourner quoi,
# quand l'administrateur se connecte, quels services écoutent. C'est la première information
# qu'un attaquant installé sur la machine cherche à obtenir.
security.bsd.see_other_uids=0
security.bsd.see_other_gids=0

# --- surface d'information du noyau ---------------------------------------
# Le tampon des messages du noyau (dmesg) révèle la liste du matériel, les modules chargés, les
# erreurs de pilotes. Un utilisateur ordinaire n'a aucune raison de le lire.
security.bsd.unprivileged_read_msgbuf=0

# Un utilisateur ne doit pas pouvoir inspecter la mémoire d'un processus qui n'est pas le sien.
security.bsd.unprivileged_proc_debug=0

# --- protection des fichiers temporaires -----------------------------------
# Empêche l'attaque par lien physique : créer un lien dans /tmp vers un fichier d'un autre
# utilisateur, puis le lui faire écraser par un programme privilégié.
security.bsd.hardlink_check_uid=1
security.bsd.hardlink_check_gid=1

# --- noyaux et vidages mémoire ---------------------------------------------
# Un programme setuid qui plante ne doit pas écrire un vidage mémoire contenant ses secrets.
kern.sugid_coredump=0

# Rend les numéros de processus imprévisibles : on ne peut plus les deviner pour viser juste.
kern.randompid=1

# --- comportement réseau ----------------------------------------------------
# Un port fermé reste MUET : ni refus TCP, ni message ICMP. Un scan devient donc beaucoup plus
# lent et beaucoup plus bavard — et la liste des services devient difficile à établir.
net.inet.tcp.blackhole=2
net.inet.udp.blackhole=1

# Protection contre l'inondation de connexions (SYN flood) : le serveur ne garde pas d'état
# pour une connexion qui n'aboutit jamais.
net.inet.tcp.syncookies=1

# Ni redirections ICMP, ni routage par la source : deux techniques classiques de détournement
# de trafic, sans aucun usage légitime sur un serveur de fichiers.
net.inet.icmp.drop_redirect=1
net.inet.ip.redirect=0
net.inet.ip.sourceroute=0
net.inet.ip.accept_sourceroute=0

# ---------------------------------------------------------------------------
# CE QUI N'EST **PAS** ICI, ET POURQUOI — c'est le paragraphe le plus important du fichier.
#
# 1. kern.securelevel N'A PAS SA PLACE ICI.
#    Le niveau de sécurité doit être relevé APRÈS le démarrage, par le script rc, et non pendant
#    le chargement de sysctl.conf — sinon il empêcherait les montages et le chargement des
#    modules nécessaires au démarrage. La façon correcte sur FreeBSD est, dans /etc/rc.conf :
#        kern_securelevel_enable="YES"
#        kern_securelevel="1"
#
# 2. ET CECI A UNE CONSÉQUENCE DIRECTE SUR NOS LECTEURS RÉSEAU (A-68).
#    Au niveau 1, plus AUCUN module noyau ne peut être chargé après le démarrage. Or
#    `mount_smbfs`, qui branche les lecteurs réseau du script de connexion, a besoin du module
#    smbfs. Il faudra donc le charger au démarrage, dans rc.conf :
#        kld_list="smbfs"
#    Sans cette ligne, les lecteurs réseau cesseraient de fonctionner le jour où le niveau de
#    sécurité serait relevé. Cette interaction n'était écrite nulle part : elle est notée ici et
#    dans docs/64. C'est exactement le genre de piège qu'un durcissement mal ordonné provoque.
#
# 3. Aucun réglage de performance (ZFS, réseau, mémoire) n'est ici. Ce fichier est un fichier de
#    SÉCURITÉ : y mêler du réglage de performance rendrait les deux illisibles.
# ---------------------------------------------------------------------------
