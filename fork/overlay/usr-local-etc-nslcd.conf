# NexBSD — /usr/local/etc/nslcd.conf
#
# ORIGINE : contenu EXTRAIT de scripts/65-resoudre-identites-nss.sh (heredoc, l. 88-118), qui l'a
#          écrit et fait fonctionner sur le banc le 2026-10-25 (C-14 corrigé, T-04-G rejoué 11/11).
#          Preuve : tests/results/T-04G-persistance.md
#
# RÔLE : c'est la passerelle entre le système (NSS) et l'annuaire. Sans lui, la machine ne sait pas
#        traduire uid=10000 en « omrane » — c'était exactement la cause de C-14.
#
# STATUT : fichier de référence du produit. Aucune image NexBSD n'existe à ce jour (jalon J5).
#
# ⚠️ SECRET : bindpw n'est PAS en clair ici. Le produit doit générer un compte de LECTURE dédié
#    (ne pas réutiliser cn=admin) et poser son mot de passe à l'installation.
#    Placeholder : @NEXBSD_LDAP_BINDPW@   — droits du fichier : 600 (il contient un secret).
#    Le banc utilisait cn=admin + « [mot de passe du banc — masqué] » : acceptable en laboratoire, PAS en produit.

uid nslcd
gid nslcd
uri ldap://127.0.0.1/
base dc=nexbsd,dc=local
binddn cn=admin,dc=nexbsd,dc=local
bindpw @NEXBSD_LDAP_BINDPW@
scope sub
ldap_version 3
timelimit 10
bind_timelimit 5

# --- utilisateurs ---
filter passwd (&(objectClass=posixAccount)(uid=*))
map    passwd uid           uid
map    passwd uidNumber     uidNumber
map    passwd gidNumber     gidNumber
map    passwd gecos         cn
map    passwd homeDirectory homeDirectory
map    passwd loginShell    loginShell

# --- groupes ---
filter group (&(objectClass=posixGroup)(cn=*))
map    group gidNumber gidNumber
map    group memberUid memberUid
