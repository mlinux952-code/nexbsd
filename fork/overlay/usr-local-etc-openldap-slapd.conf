# NexBSD — /usr/local/etc/openldap/slapd.conf
#
# ORIGINE : contenu EXTRAIT de scripts/60-banc-T04-ldap.sh (heredoc, l. 44-58), qui l'a écrit
#          et fait fonctionner sur la VM du banc le 2026-10-24 (T-04 RÉUSSI).
#          Preuve : tests/results/T-04-ldap-annuaire.md
#
# STATUT : fichier de référence du produit. Il n'est PAS encore installé par une chaîne de
#          release (aucune image NexBSD n'existe — jalon J5).
#
# ⚠️ SECRET : rootpw n'est VOLONTAIREMENT PAS écrit en clair ici. Le banc utilisait
#    « [mot de passe du banc — masqué] » (laboratoire). Le produit doit GÉNÉRER ce mot de passe à l'installation
#    et le stocker hors du dépôt. Le marqueur @NEXBSD_LDAP_ROOTPW@ doit être remplacé par
#    l'installeur ; un fichier non substitué ne doit pas être livré.

include		/usr/local/etc/openldap/schema/core.schema
include		/usr/local/etc/openldap/schema/cosine.schema
include		/usr/local/etc/openldap/schema/inetorgperson.schema
include		/usr/local/etc/openldap/schema/nis.schema
# samba.schema (GPL-3.0+) : JAMAIS dans le dépôt ni dans la couche Base — voir ADR-0012.
# Il est installé par la couche Plateforme, avec contrôle d'empreinte :
#   sha256 attendu : b9081b7234762c3fc02861fbb88ed8b52a523dced38e15051dc980f0b34b23dd
# include	/usr/local/etc/openldap/schema/samba.schema

pidfile		/var/run/openldap/slapd.pid
argsfile	/var/run/openldap/slapd.args

database	mdb
maxsize		1073741824
suffix		"dc=nexbsd,dc=local"
rootdn		"cn=admin,dc=nexbsd,dc=local"
rootpw		@NEXBSD_LDAP_ROOTPW@
directory	/var/db/openldap-data
index		objectClass eq

# NOTE TERRAIN (T-04) : sur le banc, slapd a d'abord REFUSÉ de démarrer ; le script 60 a alors
# ajouté « moduleload back_mdb » en tête. Ici le module est déjà chargé (paquet 2.6+), mais si le
# service refuse de démarrer sur une nouvelle plateforme, la première chose à essayer est
# précisément cette ligne — c'est ce que le banc a appris.
