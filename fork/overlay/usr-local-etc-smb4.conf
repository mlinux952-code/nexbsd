# NexBSD — /usr/local/etc/smb4.conf
#
# ORIGINE : fusion de deux états RÉELLEMENT TESTÉS sur le banc :
#   - scripts/62-banc-T04E-samba-ldap.sh (l. 182-203) → Samba authentifie VIA l'annuaire (T-04-E)
#   - scripts/63-banc-T04F-droits-groupes.sh (l. 315-349) → droits par groupes + ldapsam:trusted (T-04-F)
#   Preuves : tests/results/T-04E-samba-ldap.md, T-04F-droits-groupes.md
#   Le retour après redémarrage a été prouvé séparément (T-04-G, 11/11).
#
# STATUT : fichier de référence du produit. Aucune image NexBSD n'existe à ce jour (jalon J5).
#
# ⚠️ SECRET : « ldap admin dn » est écrit ici, mais le MOT DE PASSE associé vit dans secrets.tdb,
#    posé à l'installation par « smbpasswd -w » avec un secret généré (jamais commité).
#    Le banc utilisait « adminsecret » (laboratoire).
#
# DIFFÉRENCES ASSUMÉES par rapport au banc (à valider lors de l'installation) :
#   - server string : « NexBSD » (le banc disait « banc T-04-F »)
#   - log level 2 → 1 : le niveau 2 du banc servait au diagnostic du test, pas au produit
#   - ldapsam:trusted = yes est CONSERVÉ : c'est lui qui fait appliquer les droits des groupes
#     de l'annuaire (C-13 avait montré qu'en son absence, la résolution gid → SID échoue)

[global]
   workgroup = NEXBSD
   netbios name = NEXBSDFS
   server string = NexBSD
   security = user
   passdb backend = ldapsam:ldap://127.0.0.1
   ldapsam:trusted = yes
   ldap admin dn = cn=admin,dc=nexbsd,dc=local
   ldap suffix = dc=nexbsd,dc=local
   ldap user suffix = ou=people
   ldap group suffix = ou=groups
   ldap machine suffix = ou=computers
   ldap idmap suffix = ou=idmap
   ldap ssl = off
   ldap passwd sync = no
   log level = 1

; partage historique (T-03 / T-04-E), conservé
[partage]
   path = /var/samba/partage
   read only = no
   guest ok = no

; écriture réservée au groupe « bureau » (gid 2001, défini dans l'annuaire)
; 2770 = setgid + écriture de groupe : les fichiers créés héritent du groupe du dossier
[commun]
   path = /var/samba/commun
   read only = no
   guest ok = no
   create mask = 0660
   directory mask = 2770

; lecture seule pour tous les comptes authentifiés
[public]
   path = /var/samba/public
   read only = yes
   guest ok = no
