# NexBSD — intégration continue : production de l'image sur une machine FreeBSD
#
# POURQUOI CE FICHIER EXISTE (2026-10-27) :
#   Le poste du responsable a 3,7 Go de RAM et 4 threads. `make buildworld` exige >= 8 Go
#   (ADR-0010, profil L3). Résultat constaté : 25 fichiers de produit, 13 scripts de banc,
#   0 image produite en quatre jours. Ce fichier sort le projet de la VM.
#
# ⚠️ NOMS D'IMAGES VÉRIFIÉS LE 2026-10-27 dans la documentation Cirrus
#    (https://cirrus-ci.org/guide/FreeBSD/) — familles listées à cette date :
#       freebsd-16-0-snap
#       freebsd-15-0-amd64-ufs   (15.0-RELEASE, UFS)   <-- utilisée ci-dessous
#       freebsd-15-0-amd64-zfs   (15.0-RELEASE, ZFS)
#       freebsd-14-3
#    « freebsd-15-1 » N'EST PAS listée. Le projet cible 15.1-RELEASE (src.txz) : voir la
#    tâche « sonder » qui vérifie si une famille 15.1 existe réellement. Ne pas supposer.
#
# ⚠️ STATUT : ce fichier n'a JAMAIS tourné. Première exécution = première vérité.
#    Étape 1 (tâches « controles » + « sonder ») : ~2 minutes, ne construit rien.
#    Étape 2 (tâche « image ») : plusieurs heures, déclenchée manuellement — voir plus bas.

# ---------------------------------------------------------------------------
# Tâche 0 — SONDER : existe-t-il une image 15.1 dans le catalogue ?
#   Elle a le droit d'échouer : son but est de rapporter la vérité, pas de réussir.
# ---------------------------------------------------------------------------
sonder_task:
  name: "SONDE — quelle version de FreeBSD propose Cirrus ?"
  allow_failures: true
  timeout_in: 10m
  freebsd_instance:
    image_family: freebsd-15-1        # à vérifier : peut ne pas exister
    cpu: 2
    memory: 4G
  version_script: |
    uname -a
    echo "--- version exacte ---"
    freebsd-version -ku

# ---------------------------------------------------------------------------
# Tâche 1 — CONTRÔLES : le delta est-il intact, le registre conforme, la chaîne prête ?
#   Aucune construction. Deux minutes. C'est le premier vrai pas de la CI.
# ---------------------------------------------------------------------------
controles_task:
  name: "CONTROLES — delta, registre des acquis, simulation de production"
  timeout_in: 15m
  freebsd_instance:
    image_family: freebsd-15-0-amd64-ufs
    cpu: 2
    memory: 4G
  env:
    NEXBSD_SORTIE: ${CIRRUS_WORKING_DIR}/images
  delta_script: |
    set -e
    sh scripts/70-verifier-delta.sh
    sh scripts/72-verifier-acquis.sh
  simulation_script: |
    set -e
    sh scripts/74-produire-image.sh --simulation

# ---------------------------------------------------------------------------
# Tâche 2 — IMAGE : la production réelle. DÉCLENCHEMENT MANUEL.
#
# ⚠️ DEUX PLAFONDS DU GRATUIT, VÉRIFIÉS LE 2026-10-28 (ne pas les ignorer) :
#   1. DURÉE MAXIMALE D'UNE TÂCHE = 2 HEURES pour les tâches gratuites.
#      J'avais écrit "timeout_in: 300m" : REFUSÉ par la plateforme. Corrigé à 120m, le maximum.
#      Conséquence : le travail n'est PAS conservé entre deux tâches. Si la construction dépasse
#      2 h, la machine est détruite et le travail est perdu. Ce n'est donc PAS une construction
#      « étalée sur plusieurs jours » : c'est UNE exécution continue de 2 h maximum.
#   2. QUOTA MENSUEL = 50 crédits de calcul (≈ 10 000 minutes-CPU pour du Linux). Une tâche de
#      8 cœurs pendant 2 h consomme 960 minutes-CPU. Le quota devrait tenir, mais la conversion
#      exacte pour FreeBSD n'est PAS documentée : on la mesurera sur la première exécution.
#
# POURQUOI CETTE TÂCHE MESURE AU LIEU DE PROMETTRE :
#   Chaque étape imprime l'heure et l'espace disque. Au premier passage, on saura où passent les
#   minutes et si les 2 h suffisent — au lieu de le supposer. Si ça ne suffit pas, on découpera
#   (buildworld seule dans une tâche, média dans une autre), mais avec des chiffres, pas des espoirs.
# ---------------------------------------------------------------------------
image_task:
  name: "IMAGE — buildworld + configuration + media (max 2 h)"
  timeout_in: 120m
  only_if: $CIRRUS_BRANCH == 'nexbsd-image' || $NEXBSD_IMAGE == 'oui'
  freebsd_instance:
    image_family: freebsd-15-0-amd64-ufs
    cpu: 8
    memory: 16G
  env:
    NEXBSD_SORTIE: ${CIRRUS_WORKING_DIR}/images
    NEXBSD_SID: S-1-5-21-0000000000-0000000000-0000000000
    NEXBSD_LDAP_ROOTPW: mdp-de-laboratoire-a-remplacer
    NEXBSD_LDAP_BINDPW: mdp-de-laboratoire-a-remplacer
  prepare_script: |
    set -e
    date -u +"DEBUT %Y-%m-%dT%H:%M:%SZ"
    uname -a
    echo "--- CPU ---";  sysctl -n hw.ncpu
    echo "--- RAM ---";  sysctl -n hw.physmem
    echo "--- DISQUE ---"; df -h
    # buildworld exige ~30 Go libres en plus du systeme. Sans ce controle, on decouvrirait
    # le manque d'espace apres 40 minutes de compilation. On echoue AVANT, en 3 secondes.
    GO=$(df -k /usr/obj 2>/dev/null | awk 'NR==2 {print int($4/1048576)}')
    echo "libres dans /usr/obj : ${GO} Go"
    [ "${GO:-0}" -ge 25 ] || { echo "ERREUR : ${GO} Go libres seulement, 25 Go minimum."; exit 1; }
  build_script: |
    set -e
    mkdir -p "$NEXBSD_SORTIE"
    date -u +"LANCEMENT %Y-%m-%dT%H:%M:%SZ"
    sh scripts/70-verifier-delta.sh
    sh scripts/74-produire-image.sh --sortie "$NEXBSD_SORTIE" --obj /usr/obj
    date -u +"FIN %Y-%m-%dT%H:%M:%SZ"
  manifeste_script: |
    set -e
    ls -l "$NEXBSD_SORTIE"
    cat "$NEXBSD_SORTIE"/MANIFESTE-*.txt || echo "aucun manifeste : la chaine s'est arretee avant"
    echo "--- empreinte de l'image ---"
    sha256 -q "$NEXBSD_SORTIE"/*.img 2>/dev/null || sha256 -q "$NEXBSD_SORTIE"/*.ufs 2>/dev/null || echo "AUCUNE IMAGE"
  images_artifacts:
    path: "images/**"
    expire_in: 30 days
