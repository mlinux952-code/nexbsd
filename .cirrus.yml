# NexBSD — intégration continue : production de l'image sur une machine FreeBSD
#
# POURQUOI CE FICHIER EXISTE (2026-10-27) :
#   Le poste du responsable a 3,7 Go de RAM et 4 threads. `make buildworld` exige >= 8 Go
#   (ADR-0010, profil L3). Résultat constaté : 25 fichiers de produit, 13 scripts de banc,
#   0 image produite en quatre jours. Ce fichier sort le projet de la VM.
#
# ⚠️ NOMS D'IMAGES VÉRIFIÉS LE 2026-10-27 dans la documentation Cirrus
#    (https://cirrus-ci.org/guide/FreeBSD/) — familles listées à cette date :
#       freebsd-16-0-snap
#       freebsd-15-0-amd64-ufs   (15.0-RELEASE, UFS)   <-- utilisée ci-dessous
#       freebsd-15-0-amd64-zfs   (15.0-RELEASE, ZFS)
#       freebsd-14-3
#    « freebsd-15-1 » N'EST PAS listée. Le projet cible 15.1-RELEASE (src.txz) : voir la
#    tâche « sonder » qui vérifie si une famille 15.1 existe réellement. Ne pas supposer.
#
# ⚠️ STATUT : ce fichier n'a JAMAIS tourné. Première exécution = première vérité.
#    Étape 1 (tâches « controles » + « sonder ») : ~2 minutes, ne construit rien.
#    Étape 2 (tâche « image ») : plusieurs heures, déclenchée manuellement — voir plus bas.

# ---------------------------------------------------------------------------
# Tâche 0 — SONDER : existe-t-il une image 15.1 dans le catalogue ?
#   Elle a le droit d'échouer : son but est de rapporter la vérité, pas de réussir.
# ---------------------------------------------------------------------------
sonder_task:
  name: "SONDE — quelle version de FreeBSD propose Cirrus ?"
  allow_failures: true
  timeout_in: 10m
  freebsd_instance:
    image_family: freebsd-15-1        # à vérifier : peut ne pas exister
    cpu: 2
    memory: 4G
  version_script: |
    uname -a
    echo "--- version exacte ---"
    freebsd-version -ku

# ---------------------------------------------------------------------------
# Tâche 1 — CONTRÔLES : le delta est-il intact, le registre conforme, la chaîne prête ?
#   Aucune construction. Deux minutes. C'est le premier vrai pas de la CI.
# ---------------------------------------------------------------------------
controles_task:
  name: "CONTROLES — delta, registre des acquis, simulation de production"
  timeout_in: 15m
  freebsd_instance:
    image_family: freebsd-15-0-amd64-ufs
    cpu: 2
    memory: 4G
  env:
    NEXBSD_SORTIE: ${CIRRUS_WORKING_DIR}/images
  delta_script: |
    set -e
    sh scripts/70-verifier-delta.sh
    sh scripts/72-verifier-acquis.sh
  simulation_script: |
    set -e
    sh scripts/74-produire-image.sh --simulation

# ---------------------------------------------------------------------------
# Tâche 2 — IMAGE : la production réelle. DÉCLENCHEMENT MANUEL.
#   Pourquoi manuel : une construction coûte plusieurs heures de crédit CI et plusieurs Go.
#   On ne la lance qu'une fois que (a) les contrôles passent et (b) la question 15.0/15.1
#   est tranchée par la sonde. Sinon on dépense des heures pour découvrir un nom d'image faux.
#   Déclenchement : pousser sur la branche `nexbsd-image`, ou poser la variable
#   CIRRUS_NEXBSD_IMAGE=oui dans les réglages du dépôt.
# ---------------------------------------------------------------------------
image_task:
  name: "IMAGE — buildworld + release + empreinte"
  timeout_in: 300m
  only_if: $CIRRUS_BRANCH == 'nexbsd-image' || $NEXBSD_IMAGE == 'oui'
  freebsd_instance:
    image_family: freebsd-15-0-amd64-ufs
    cpu: 8
    memory: 16G
  env:
    NEXBSD_SORTIE: ${CIRRUS_WORKING_DIR}/images
  prepare_script: |
    set -e
    df -h
    sysctl -n hw.ncpu hw.physmem
  build_script: |
    set -e
    mkdir -p "$NEXBSD_SORTIE"
    sh scripts/74-produire-image.sh --sortie "$NEXBSD_SORTIE" --obj /usr/obj
  manifeste_script: |
    set -e
    ls -l "$NEXBSD_SORTIE"
    cat "$NEXBSD_SORTIE"/MANIFESTE-*.txt
  images_artifacts:
    path: "images/**"
    expire_in: 30 days
