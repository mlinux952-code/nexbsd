# NexBSD — chaîne de production sur GitHub Actions, avec une VRAIE VM FreeBSD
#
# ═══════════════════════════════════════════════════════════════════════════════
#  CE QUI A CHANGÉ EN v4 (2026-10-28) — et pourquoi
# ═══════════════════════════════════════════════════════════════════════════════
#
#  Nous avions un problème d'INFORMATION, pas seulement de code : à chaque
#  exécution, le responsable ne pouvait rapporter que la liste des étapes
#  (« Run 'run' in VM » … « Error: ssh exited with code 1 »), jamais le TEXTE
#  de l'erreur. On corrigeait donc à l'aveugle. C'est fini.
#
#  La documentation de l'action (lue le 2026-10-28) décrit deux mécanismes :
#
#   1. `shell: freebsd {0}` — UNE SEULE VM démarre (étape « DÉMARRER LA VM »),
#      puis CHAQUE étape suivante s'exécute DANS cette même VM. Conséquence :
#      chaque contrôle devient une étape nommée et séparée. Le rond vert/rouge
#      suffit alors à savoir QUEL contrôle échoue, sans rien déplier.
#
#   2. `copyback` (actif par défaut avec rsync) — les fichiers créés DANS la VM
#      reviennent sur la machine hôte à la fin de chaque étape. Donc la VM écrit
#      `rapport-ci.txt`, et une dernière étape l'affiche dans le RÉSUMÉ de la
#      page d'exécution : lisible en haut de page, sans déplier un seul journal.
#
#  C'est exactement l'information qui manquait depuis quatre exécutions.
#
#  HISTORIQUE (aucune exécution verte, aucune cachée) :
#   #1  1 min 04 s — la VM ne démarrait pas (`ubuntu-latest` migré vers Ubuntu 26)
#   #2  38 s / 53 s — la VM DÉMARRE ; échec dû à `git` absent de FreeBSD (C-34)
#   #3  1 min 27 s / 1 min 02 s — prepare passe (pkg + git s'installent) ; l'échec
#      est maintenant DANS `run`, et BUREAU échoue encore au prepare (node).
#      → on ne devine plus : on instrumente.
#
#  ÉTAT : cette version n'a JAMAIS été exécutée.

name: NexBSD

on:
  push:
    branches: [main, nexbsd-image]
  workflow_dispatch:

jobs:

  # ═══════════════════════════════════════════════════════════════════════════
  # 0. SONDE — la VM démarre-t-elle, et avec quoi ? Ne lance aucun script du
  #    dépôt. Écrit ses réponses dans le rapport lisible en haut de page.
  # ═══════════════════════════════════════════════════════════════════════════
  sonde:
    name: "SONDE — la VM FreeBSD et son environnement"
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - name: "DÉMARRER LA VM FreeBSD 15.1"
        id: vm
        uses: vmactions/freebsd-vm@v1
        with:
          release: "15.1"

      - name: "SONDE — ce que la machine contient réellement"
        shell: freebsd {0}
        run: |
          {
            echo "### SONDE — environnement de la VM"
            echo ""
            echo '```'
            uname -a
            freebsd-version -ku
            echo "utilisateur : $(id -un) (uid $(id -u))"
            echo "repertoire  : $(pwd)"
            echo ""
            echo "git  : $(command -v git || echo 'ABSENT (c est normal : git n est pas dans FreeBSD de base)')"
            echo ".git : $([ -d .git ] && echo 'present dans la copie' || echo 'ABSENT de la copie')"
            echo "pkg  : $(command -v pkg || echo 'NON AMORCE (il faut pkg bootstrap)')"
            echo "node : $(command -v node || echo 'ABSENT (a installer par pkg)')"
            echo ""
            echo "fichiers dans fork/    : $(find fork -type f 2>/dev/null | wc -l | tr -d ' ') (attendu 33)"
            echo "scripts en fork/bureau : $(find fork/bureau -type f 2>/dev/null | wc -l | tr -d ' ')"
            echo "espace libre /usr     : $(df -h /usr | awk 'NR==2 {print $4}')"
            echo '```'
          } | tee rapport-ci.txt

      - name: "Rapport lisible (en haut de la page, sans rien déplier)"
        if: always()
        run: |
          echo "## NexBSD — rapport de la SONDE" >> "$GITHUB_STEP_SUMMARY"
          cat rapport-ci.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "_Aucun rapport : la VM n'a pas démarré._" >> "$GITHUB_STEP_SUMMARY"

  # ═══════════════════════════════════════════════════════════════════════════
  # 1. CONTRÔLES — trois garde-fous, TROIS ÉTAPES SÉPARÉES dans la même VM.
  #    Un rond rouge nomme directement le garde-fou en cause.
  # ═══════════════════════════════════════════════════════════════════════════
  controles:
    name: "CONTRÔLES — delta, registre, simulation"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: "DÉMARRER LA VM FreeBSD 15.1"
        id: vm
        uses: vmactions/freebsd-vm@v1
        with:
          release: "15.1"

      - name: "1/3 — le delta du fork est-il intact ? (script 70)"
        shell: freebsd {0}
        run: |
          sh scripts/70-verifier-delta.sh > /tmp/r.txt 2>&1; CODE=$?
          { echo "### 1/3 — delta du fork — code $CODE"
            grep -E "mode de comptage|fichiers comptes|VERDICT|\[KO\]" /tmp/r.txt | head -20
            echo ""; } >> rapport-ci.txt
          cat /tmp/r.txt
          exit $CODE

      - name: "2/3 — le registre des acquis est-il conforme ? (script 72)"
        shell: freebsd {0}
        run: |
          sh scripts/72-verifier-acquis.sh > /tmp/r.txt 2>&1; CODE=$?
          { echo "### 2/3 — registre des acquis — code $CODE"
            grep -E "mode de verification|VERDICT|\[KO\]" /tmp/r.txt | head -20
            echo ""; } >> rapport-ci.txt
          cat /tmp/r.txt
          exit $CODE

      - name: "3/3 — la production est-elle simulable ? (script 74 --simulation)"
        shell: freebsd {0}
        run: |
          sh scripts/74-produire-image.sh --simulation > /tmp/r.txt 2>&1; CODE=$?
          { echo "### 3/3 — simulation de production — code $CODE"
            grep -E "SIMULATION|\[KO\]|ERREUR" /tmp/r.txt | head -20
            echo ""; } >> rapport-ci.txt
          cat /tmp/r.txt
          exit $CODE

      - name: "Rapport lisible (en haut de la page, sans rien déplier)"
        if: always()
        run: |
          echo "## NexBSD — CONTRÔLES dans une vraie VM FreeBSD 15.1" >> "$GITHUB_STEP_SUMMARY"
          cat rapport-ci.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "_Aucun rapport produit._" >> "$GITHUB_STEP_SUMMARY"

  # ═══════════════════════════════════════════════════════════════════════════
  # 2. BUREAU — installation de node isolée, puis les tests, étape par étape.
  #    L'échec #3 venait du `prepare` : on le transforme en étape visible.
  # ═══════════════════════════════════════════════════════════════════════════
  bureau:
    name: "BUREAU — tests de session et d'authentification"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: "DÉMARRER LA VM FreeBSD 15.1"
        id: vm
        uses: vmactions/freebsd-vm@v1
        with:
          release: "15.1"

      - name: "1/3 — installer node (pkg), et le prouver"
        shell: freebsd {0}
        run: |
          { echo "### 1/3 — installation de node"
            echo '```'
            env ASSUME_ALWAYS_YES=yes pkg bootstrap -f 2>&1 | tail -3; echo "bootstrap : code $?"
            pkg install -y node22 2>&1 | tail -8; echo "install node22 : code $?"
            echo "node : $(command -v node || echo ABSENT)"
            command -v node >/dev/null 2>&1 && node --version
            echo '```'
            echo ""; } > /tmp/r.txt 2>&1
          cat /tmp/r.txt >> rapport-ci.txt; cat /tmp/r.txt
          command -v node >/dev/null 2>&1 || { echo "::error::node n a pas pu etre installe — les 17 cas JS ne peuvent pas tourner"; exit 1; }

      - name: "2/3 — 17 cas de logique de session (node)"
        shell: freebsd {0}
        run: |
          node fork/bureau/tester-session.js > /tmp/r.txt 2>&1; CODE=$?
          { echo "### 2/3 — session (17 cas) — code $CODE"
            tail -25 /tmp/r.txt
            echo ""; } >> rapport-ci.txt
          cat /tmp/r.txt
          exit $CODE

      # EXÉCUTION #4 : cette étape échouait parce qu'elle tournait en ROOT. Le script testé
      # (nexbsd-authentifier.sh) refuse root volontairement — en root, `su` ne demande aucun
      # mot de passe et l'écran d'ouverture serait décoratif (A-14). Ce n'était donc pas un
      # défaut de logique : c'était la sécurité qui s'appliquait. On lance maintenant le test
      # sous un compte ORDINAIRE, exactement comme la session réelle le fera.
      - name: "3/3 — 14 cas d'authentification (sh), sous un compte ORDINAIRE"
        shell: freebsd {0}
        run: |
          UTIL=nexbsd-test
          {
            echo "### 3/3 — authentification (14 cas), sous un compte ordinaire"
            echo '```'
            echo "utilisateur de la CI avant : $(id -un) (uid $(id -u))"
            pw useradd -n "$UTIL" -m -s /bin/sh 2>&1 || echo "(compte deja present)"
            echo "compte de test : $UTIL"
          } > /tmp/entete.txt 2>&1

          REP=/tmp/nexbsd-test
          rm -rf "$REP"
          cp -a "$PWD" "$REP" && chown -R "$UTIL" "$REP"

          su -l "$UTIL" -c "cd '$REP' && sh fork/bureau/tester-authentification.sh" \
            > /tmp/r.txt 2>&1; CODE=$?

          { cat /tmp/entete.txt
            tail -30 /tmp/r.txt
            echo '```'
            echo ""
            echo "code de sortie : $CODE"
            echo ""; } >> rapport-ci.txt
          cat /tmp/entete.txt /tmp/r.txt
          exit $CODE

      - name: "Rapport lisible (en haut de la page, sans rien déplier)"
        if: always()
        run: |
          echo "## NexBSD — BUREAU dans une vraie VM FreeBSD 15.1" >> "$GITHUB_STEP_SUMMARY"
          cat rapport-ci.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "_Aucun rapport produit._" >> "$GITHUB_STEP_SUMMARY"

  # ═══════════════════════════════════════════════════════════════════════════
  # 3. IMAGE — la production réelle. Déclenchement MANUEL uniquement.
  # ═══════════════════════════════════════════════════════════════════════════
  image:
    name: "IMAGE — buildworld + configuration + media"
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/nexbsd-image'
    steps:
      - uses: actions/checkout@v5

      - name: "Libérer de l'espace disque"
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force || true
          df -h /

      # La VM de cette tâche : 4 processeurs et 8 Go de mémoire, au-dessus du seuil de 7 Go
      # vérifié par scripts/74 (profil L3). La SONDE a mesuré 195 Go libres sur /usr : le
      # disque n'est pas le frein, le temps l'est.
      - name: "DÉMARRER LA VM FreeBSD 15.1 (4 CPU, 8 Go)"
        id: vm
        uses: vmactions/freebsd-vm@v1
        with:
          release: "15.1"
          cpu: 4
          mem: 8192

      # ── Étape 1 : ce qui échoue vite doit échouer TOUT DE SUITE ──────────────
      # Un buildworld dure des heures. Vérifier la capacité et le réseau en 30 secondes,
      # avant de payer quatre heures, est la seule façon honnête de lancer ça.
      - name: "1/4 — la machine peut-elle construire ? (30 secondes)"
        shell: freebsd {0}
        run: |
          {
            echo "### 1/4 — capacité de la machine"
            echo '```'
            uname -a
            freebsd-version -ku
            echo "CPU : $(sysctl -n hw.ncpu)"
            echo "RAM : $(( $(sysctl -n hw.physmem) / 1048576 )) Mo (minimum 7000)"
            mkdir -p /usr/obj /usr/obj/nexbsd-src
            df -h /usr /usr/obj
            GO=$(df -k /usr/obj | awk 'NR==2 {print int($4/1048576)}')
            echo "libres dans /usr/obj : ${GO} Go (minimum 20)"
            echo "fetch : $(command -v fetch || echo ABSENT)"
          } > /tmp/r.txt 2>&1
          cat /tmp/r.txt >> rapport-ci.txt; cat /tmp/r.txt

          RAM=$(sysctl -n hw.physmem | awk '{print int($1/1048576)}')
          GO=$(df -k /usr/obj | awk 'NR==2 {print int($4/1048576)}')
          [ "$RAM" -ge 7000 ] || { echo "::error::RAM insuffisante : ${RAM} Mo"; exit 1; }
          [ "$GO" -ge 20 ]   || { echo "::error::disque insuffisant : ${GO} Go"; exit 1; }
          command -v fetch >/dev/null || { echo "::error::fetch absent"; exit 1; }
          echo "capacité suffisante : ${RAM} Mo de RAM, ${GO} Go libres"

      # ── Étape 2 : les sources, vérifiées par empreinte ───────────────────────
      # Si le téléchargement ou l'empreinte échoue, on le sait en ~10 minutes au lieu de
      # le découvrir après quatre heures de construction. src.txz est extrait sur le grand
      # disque (/usr/obj), PAS dans /tmp : c'est un arbre de plus de 1 Go.
      - name: "2/4 — télécharger, VÉRIFIER l'empreinte, extraire src.txz (~10 minutes)"
        shell: freebsd {0}
        run: |
          # C-37 : NE PLUS RECOPIER l'empreinte ici. Elle est lue dans scripts/74, qui est la
          # SEULE source de verite. La duplication etait la cause racine : deux copies existaient,
          # l'une fausse, et c'est celle-ci qui etait utilisee.
          SHA_ATTENDU=$(sed -n 's/^SHA_SRC="\(.*\)"$/\1/p' scripts/74-produire-image.sh)
          [ -n "$SHA_ATTENDU" ] || { echo "::error::empreinte introuvable dans scripts/74"; exit 1; }
          URL="https://download.freebsd.org/releases/amd64/amd64/15.1-RELEASE/src.txz"
          # Tout est écrit dans /tmp/r.txt, PUIS affiché, PUIS le code de sortie est rendu :
          # ainsi rien n'est perdu même quand ça échoue (leçon de C-35).
          {
            echo "### 2/4 — sources FreeBSD 15.1-RELEASE"
            echo '```'
            date -u +"debut %Y-%m-%dT%H:%M:%SZ"
          } > /tmp/r.txt 2>&1

          if fetch -q -o /tmp/src.txz "$URL"; then
            { ls -l /tmp/src.txz
              EMP=$(sha256 -q /tmp/src.txz)
              echo "empreinte obtenue  : $EMP"
              echo "empreinte attendue : $SHA_ATTENDU"
            } >> /tmp/r.txt 2>&1
            if [ "$EMP" = "$SHA_ATTENDU" ]; then
              echo "empreinte VERIFIEE" >> /tmp/r.txt
              rm -rf /usr/obj/nexbsd-src && mkdir -p /usr/obj/nexbsd-src
              if tar -xpf /tmp/src.txz -C /usr/obj/nexbsd-src >>/tmp/r.txt 2>&1; then
                # C-41 (2026-10-28) : src.txz n'est PAS un arbre nu. Ses membres sont
                # « ./usr/src/... » (c'est une archive destinee a etre extraite a la racine).
                # Extraite dans /usr/obj/nexbsd-src, elle donne /usr/obj/nexbsd-src/usr/src.
                # L'exécution #14 a montre exactement cela : « arbres extraits : usr », et le
                # pré-vol a refuse net. On ne DEVINE plus l'emplacement : on le CHERCHE, et on
                # l'ECRIT dans l'espace de travail pour que les etapes suivantes le relisent.
                if [ -f /usr/obj/nexbsd-src/Makefile ]; then
                  SRCDIR=/usr/obj/nexbsd-src
                elif [ -f /usr/obj/nexbsd-src/usr/src/Makefile ]; then
                  SRCDIR=/usr/obj/nexbsd-src/usr/src
                else
                  SRCDIR=""
                fi
                { echo "arbres extraits : $(ls /usr/obj/nexbsd-src | tr '\n' ' ')"
                  echo "arbre source trouve : ${SRCDIR:-INTROUVABLE}"
                  echo "$SRCDIR" > .nexbsd-srcdir
                  if [ -n "$SRCDIR" ]; then
                    echo "Makefile present : $(wc -l < "$SRCDIR/Makefile") lignes"
                    echo "sys/amd64/conf : $(ls "$SRCDIR/sys/amd64/conf" 2>/dev/null | wc -l | tr -d ' ') fichiers"
                  fi
                  df -h /usr/obj
                  date -u +"fin %Y-%m-%dT%H:%M:%SZ"
                } >> /tmp/r.txt 2>&1
                [ -n "$SRCDIR" ] && RESULTAT=ok || RESULTAT=echec
              else
                echo "EXTRACTION IMPOSSIBLE" >> /tmp/r.txt; RESULTAT=echec
              fi
            else
              echo "EMPREINTE INCORRECTE — ARRET" >> /tmp/r.txt; RESULTAT=echec
            fi
          else
            echo "TELECHARGEMENT IMPOSSIBLE (reseau ou URL)" >> /tmp/r.txt; RESULTAT=echec
          fi
          echo '```' >> /tmp/r.txt; echo "" >> /tmp/r.txt

          cat /tmp/r.txt >> rapport-ci.txt; cat /tmp/r.txt
          [ "${RESULTAT:-echec}" = ok ] || { echo "::error::etape 2/4 en echec — voir le rapport ci-dessus"; exit 1; }

      # ── Étape 3 : la construction ET l'assemblage du produit ─────────────────
      # scripts/74 reçoit --source : il ne télécharge plus rien et va directement à la
      # construction, PUIS à l'application de la configuration NexBSD dans le système,
      # puis au média. C-39 : l'ancienne chaîne appelait `make release`, qui produit un
      # média du SOCLE sans fork/overlay/ — l'image aurait été FreeBSD, pas NexBSD.
      # C-40 (2026-10-28) : l'exécution #10 a échoué ici en DEUX MINUTES, pas en six heures.
      # Un échec aussi rapide ne vient pas de la compilation : il vient de la STRUCTURE (arbre
      # incomplet, cible absente, outil manquant). Un pré-vol de dix secondes le dit avant de
      # lancer quoi que ce soit, au lieu de le découvrir au milieu du journal.
      - name: "2bis — pré-vol de la construction (10 secondes)"
        shell: freebsd {0}
        run: |
          PRE=ok
          SRCDIR=$(cat .nexbsd-srcdir 2>/dev/null)
          [ -n "$SRCDIR" ] || { echo "chemin de l'arbre non trouve (.nexbsd-srcdir absent)"; exit 1; }
          echo "arbre source : $SRCDIR"

          # C-41, seconde leçon : la première version de ce pre-vol cherchait des lignes
          # « buildworld: » dans le Makefile. C'ETAIT FAUX. Dans l'arbre FreeBSD 15.1, le
          # Makefile ne definit PAS ces cibles une par une : il definit « ${TGTS}: » et met
          # les noms dans la variable TGTS (verifie sur l'archive reelle, ligne 377).
          # Un pre-vol trop strict aurait bloque une construction parfaitement valide :
          # c'est le meme defaut qu'un garde-fou qui crie a tort (lecon M-10).
          if grep -q '^${TGTS}:' "$SRCDIR/Makefile" 2>/dev/null; then
            echo "regle \${TGTS}: presente dans le Makefile"
          else
            echo "regle \${TGTS}: ABSENTE — ce n'est pas un Makefile d'arbre FreeBSD"; PRE=echec
          fi
          for cible in buildworld buildkernel installworld installkernel distribution; do
            if grep -q "\b$cible\b" "$SRCDIR/Makefile" 2>/dev/null; then
              echo "cible $cible : listee"
            else
              echo "cible $cible : ABSENTE de la liste TGTS"; PRE=echec
            fi
          done
          for f in Makefile.inc1 share/mk/bsd.subdir.mk tools/build sys/Makefile; do
            [ -e "$SRCDIR/$f" ] && echo "structure $f : present" \
              || { echo "structure $f : ABSENT — arbre incomplet"; PRE=echec; }
          done
          for outil in make makefs mkimg sha256 fetch; do
            command -v "$outil" >/dev/null 2>&1 && echo "outil $outil : $(command -v $outil)" \
              || { echo "outil $outil : ABSENT"; PRE=echec; }
          done
          [ -d "$SRCDIR/sys/amd64/conf" ] \
            && echo "sys/amd64/conf : present ($(ls "$SRCDIR/sys/amd64/conf" | wc -l | tr -d ' ') fichiers)" \
            || { echo "sys/amd64/conf : ABSENT — l'arbre n'est pas un arbre FreeBSD complet"; PRE=echec; }
          [ -f fork/70-appliquer-overlay.sh ] && echo "overlay : present" || { echo "overlay : ABSENT"; PRE=echec; }
          [ "$PRE" = ok ] || { echo "::error::pre-vol en echec — voir ci-dessus"; exit 1; }
          echo "pre-vol : tout est en place"

      - name: "3/4 — construction + assemblage NexBSD (plusieurs heures)"
        shell: freebsd {0}
        run: |
          date -u +"DEBUT %Y-%m-%dT%H:%M:%SZ"
          echo "DEBUT $(date -u +%FT%TZ)" > /tmp/debut.txt

          # R-15 : AUCUN mot de passe dans ce fichier. Le dépôt est public.
          # Priorité au secret GitHub ; sinon tirage aléatoire local, jamais affiché.
          PW_ROOT="${{ secrets.NEXBSD_LDAP_ROOTPW }}"
          PW_BIND="${{ secrets.NEXBSD_LDAP_BINDPW }}"
          [ -n "$PW_ROOT" ] || PW_ROOT=$(openssl rand -hex 16)
          [ -n "$PW_BIND" ] || PW_BIND=$(openssl rand -hex 16)
          echo "mot de passe annuaire : longueur ${#PW_ROOT} caracteres, NON affiche"

          mkdir -p images
          NEXBSD_SID="S-1-5-21-0000000000-0000000000-0000000000" \
          NEXBSD_LDAP_ROOTPW="$PW_ROOT" \
          NEXBSD_LDAP_BINDPW="$PW_BIND" \
            sh scripts/74-produire-image.sh \
              --source "$(cat .nexbsd-srcdir)" --sortie images --obj /usr/obj > build.log 2>&1
          CODE=$?
          # build.log est ecrit DANS l espace de travail : copyback le ramene sur l hote a la fin
          # de l etape, et il sera joint a l artefact. Le journal complet survit donc a la VM.

          { echo "### 3/4 — construction — code $CODE"
            echo "taille du journal : $(wc -l < build.log 2>/dev/null || echo 0) lignes"
            tail -40 build.log
            echo ""; } >> rapport-ci.txt
          # les 60 dernières lignes sont affichées dans le journal de l'étape : sur un échec,
          # c'est là qu'est la raison, sans rien déplier d'autre.
          tail -60 build.log
          [ -f images/MANIFESTE-*.txt ] && cat images/MANIFESTE-*.txt
          exit $CODE

      - name: "4/4 — empreintes des fichiers produits"
        if: always()
        shell: freebsd {0}
        run: |
          {
            echo "### 4/4 — ce qui a été produit"
            echo '```'
            ls -l images 2>/dev/null || echo "aucun fichier dans images/"
            for f in images/*; do
              [ -f "$f" ] || continue
              echo "$(sha256 -q "$f")  $(basename "$f")  $(wc -c < "$f") octets"
            done
            echo '```'
            echo ""; } > /tmp/r.txt 2>&1
          cat /tmp/r.txt >> rapport-ci.txt; cat /tmp/r.txt

      - name: "Rapport lisible (en haut de la page, sans rien déplier)"
        if: always()
        run: |
          echo "## NexBSD — IMAGE produite dans une vraie VM FreeBSD 15.1" >> "$GITHUB_STEP_SUMMARY"
          cat rapport-ci.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "_Aucun rapport produit._" >> "$GITHUB_STEP_SUMMARY"

      - name: "Déposer l'artefact"
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: nexbsd-images
          path: |
            images/**
            build.log
          if-no-files-found: ignore
          retention-days: 30
