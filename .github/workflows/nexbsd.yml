# NexBSD — chaîne de production sur GitHub Actions, avec une VRAIE VM FreeBSD
#
# ÉTAT : la version précédente de ce fichier a ÉCHOUÉ le 2026-10-28 (exécution #1).
#   Symptôme : les 3 tâches en `ssh exited with code 1`, en 1 min 04 s au total — la VM n'a donc
#   jamais démarré. Ce n'était pas nos scripts (ils sortent en code 0, vérifié), c'était la VM.
#
# DEUX CORRECTIONS, appuyées sur des faits vérifiés :
#  1. `runs-on: ubuntu-latest` -> `ubuntu-24.04` (ÉPINGLÉ). Le log de l'exécution #1 contenait
#     cet avertissement : "The ubuntu-latest label will migrate to Ubuntu 26 beginning
#     October 19, 2026". Nous sommes le 28 octobre 2026 : `ubuntu-latest` n'est plus le système
#     sur lequel l'action a été testée. On ne subit plus une migration silencieuse.
#  2. `release: "15.1"` — la documentation de vmactions liste **15.1 comme supporté** sur x86_64,
#     et c'est même la version PAR DÉFAUT de l'action. Plus d'hypothèse 15.0/15.1 : c'est notre cible.
#
# On supprime aussi tout ce qui n'était pas dans l'exemple documenté (usesh, mem sur les petites
# tâches) : moins on s'écarte de l'exemple officiel, plus on a de chances que ça démarre. La tâche
# SONDE est réduite au strict minimum (deux commandes) pour ISOLER le problème si ça échoue encore.
#
# JAMAIS EXÉCUTÉ dans cette version.

name: NexBSD

on:
  push:
    branches: [main, nexbsd-image]
  workflow_dispatch:

jobs:

  # ---------------------------------------------------------------------------
  # 0. SONDE — le strict minimum : la VM démarre-t-elle, et quelle version ?
  #    Aucun script du dépôt n'est appelé. Si CETTE tâche échoue, la cause est la VM,
  #    pas notre code. C'est le diagnostic le plus court possible.
  # ---------------------------------------------------------------------------
  sonde:
    name: "SONDE — la VM FreeBSD démarre-t-elle ?"
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: "FreeBSD 15.1 : deux commandes, rien d'autre"
        uses: vmactions/freebsd-vm@v1
        with:
          release: "15.1"
          run: |
            uname -a
            freebsd-version -ku

  # ---------------------------------------------------------------------------
  # 1. CONTRÔLES — delta, registre, simulation. ~5 minutes, aucune construction.
  # ---------------------------------------------------------------------------
  controles:
    name: "CONTRÔLES — delta, registre, simulation"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: "Contrôles dans une vraie VM FreeBSD 15.1"
        uses: vmactions/freebsd-vm@v1
        with:
          release: "15.1"
          run: |
            uname -a
            freebsd-version -ku
            echo "--- 1. le delta du produit est-il intact ? ---"
            sh scripts/70-verifier-delta.sh
            echo "--- 2. le registre des acquis est-il conforme ? ---"
            sh scripts/72-verifier-acquis.sh
            echo "--- 3. la chaîne de production est-elle simulable ? ---"
            sh scripts/74-produire-image.sh --simulation

  # ---------------------------------------------------------------------------
  # 2. BUREAU — les 31 cas de test, sur FreeBSD.
  # ---------------------------------------------------------------------------
  bureau:
    name: "BUREAU — tests de session et d'authentification"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: "Tests du bureau"
        uses: vmactions/freebsd-vm@v1
        with:
          release: "15.1"
          prepare: |
            pkg install -y node >/dev/null 2>&1 || pkg install -y node22 >/dev/null 2>&1 || true
          run: |
            echo "--- logique de session (17 cas) ---"
            node fork/bureau/tester-session.js
            echo "--- authentification (14 cas, avec un faux su) ---"
            sh fork/bureau/tester-authentification.sh

  # ---------------------------------------------------------------------------
  # 3. IMAGE — la production réelle. Déclenchement MANUEL uniquement.
  # ---------------------------------------------------------------------------
  image:
    name: "IMAGE — buildworld + configuration + media"
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/nexbsd-image'
    steps:
      - uses: actions/checkout@v4

      - name: "Libérer de l'espace disque"
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force || true
          df -h /

      - name: "Production de l'image dans une vraie VM FreeBSD 15.1"
        uses: vmactions/freebsd-vm@v1
        with:
          release: "15.1"
          cpu: 4
          mem: 8192
          run: |
            date -u +"DEBUT %Y-%m-%dT%H:%M:%SZ"
            uname -a
            freebsd-version -ku
            echo "--- CPU ---";   sysctl -n hw.ncpu
            echo "--- RAM ---";   sysctl -n hw.physmem
            echo "--- DISQUE ---"; df -h
            GO=$(df -k /usr/obj 2>/dev/null | awk 'NR==2 {print int($4/1048576)}' || echo 0)
            echo "libres dans /usr/obj : ${GO} Go"
            [ "${GO:-0}" -ge 20 ] || { echo "ERREUR : ${GO} Go libres seulement, 20 Go minimum."; exit 1; }

            mkdir -p images
            NEXBSD_SID="S-1-5-21-0000000000-0000000000-0000000000" \
            NEXBSD_LDAP_ROOTPW="mdp-de-laboratoire-a-remplacer" \
            NEXBSD_LDAP_BINDPW="mdp-de-laboratoire-a-remplacer" \
              sh scripts/74-produire-image.sh --sortie images --obj /usr/obj

            date -u +"FIN %Y-%m-%dT%H:%M:%SZ"
            echo "--- ce qui a été produit ---"
            ls -l images || true
            sha256 -q images/*.img 2>/dev/null || sha256 -q images/*.ufs 2>/dev/null || echo "AUCUNE IMAGE"

      - name: "Déposer l'artefact"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexbsd-images
          path: images/**
          if-no-files-found: warn
          retention-days: 30
