# NexBSD — release.conf (candidat)
# ---------------------------------------------------------------------------
# STATUT : [PROPOSITION] — AUCUN BUILD RÉEL.
# Utilisé par release/release.sh de l'arbre FreeBSD.
# ---------------------------------------------------------------------------

# Nom du produit (NE DOIT PAS contenir « FreeBSD » : politique de marque)
export PRODUCT=NexBSD
export REVISION=0.1-PROTOTYPE
export BRANCH=15

# Type de média visé : une clé USB amorçable, pas un DVD
export WITH_MEMSTICK=1
export WITH_DVD=0
export WITH_VMIMAGES=0

# Pas de documentation dans l'image (budget disque) ; la doc est en ligne
export NODOC=1
export NOPORTS=1
export NOSRC=1

# Compression de l'image
export WITH_COMPRESSED_IMAGES=1

# Configuration de noyau et options de construction propres à NexBSD
export KERNEL=NEXBSD_L1
export SRCCONF=${NEXBSD_DELTA:-/nxsrc/nexbsd}/src.conf

# Emplacement de sortie
export WORLDDIR=/usr/obj/nxbsd
