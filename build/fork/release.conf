# release.conf — production d'image par release.sh(7)
# STATUT : jamais exécuté. Aucune image n'a été produite par NexBSD.

# --- Identité de l'image ------------------------------------------------
# Ces valeurs sont celles que le projet veut ; elles ne sont PAS encore
# reprises par la chaîne de release tant que le delta d'identité n'est pas appliqué.
export BRANCH_OVERRIDE="NEXBSD-L1"
export MAKE_CONF="${.CURDIR}/src.conf"
# Un seul noyau : celui du profil PC faible.
export KERNCONF="NEXBSD_L1"

# --- Contenu ------------------------------------------------------------
# Pas de jeux, pas de documentation lourde : cohérent avec src.conf.
export NODOC=yes
export NOPORTS=yes          # la plateforme est distribuée en paquets signés séparément (ADR-0012)
export NOSRC=yes            # l'utilisateur final n'a pas besoin de l'arbre source

# --- Média --------------------------------------------------------------
# Cible : installation par clé USB (docs/hardware.md impose le support externe)
export WITH_VMIMAGES=no     # pas de cloud-init dans une image grand public
