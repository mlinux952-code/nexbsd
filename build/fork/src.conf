# src.conf — options de construction du monde NexBSD (profil L1, PC faible)
#
# RÈGLE : on ne retire que ce qui est justifié, une ligne = une justification.
# Chaque nom d'option ci-dessous a été VÉRIFIÉ le 2026-10-23 dans
#   reference/src.conf.5-15.1  (share/man/man5/src.conf.5, branche releng/15.1)
# Toute option non vérifiée est commentée « NON VÉRIFIÉE » et reste désactivée.
#
# STATUT : jamais utilisé pour une construction. Aucune image NexBSD n'existe.

# --- Ce qu'un PC faible n'a pas besoin de porter sur son disque ----------
WITHOUT_GAMES=yes          # jeux : aucune fonction du cahier des charges
WITHOUT_EXAMPLES=yes       # exemples : documentation, pas du système
WITHOUT_TESTS=yes          # suite de tests FreeBSD : utile aux développeurs, pas à l'utilisateur
WITHOUT_DEBUG_FILES=yes    # fichiers de débogage : plusieurs centaines de Mo

# --- Ce que NexBSD ne sera pas : un hôte de virtualisation ---------------
WITHOUT_BHYVE=yes          # bhyve = hyperviseur ; la cible est un serveur de fichiers
WITHOUT_HYPERV=yes         # pilotes invités Hyper-V ; cible = matériel réel

# --- Messagerie : hors périmètre (le courriel n'est pas une fonction N-xx)
WITHOUT_SENDMAIL=yes       # MTA historique, hors périmètre assumé

# --- Ce qui est CONSERVÉ volontairement ---------------------------------
# WITHOUT_WIRELESS / WITHOUT_BLUETOOTH : NON appliqués.
#   Un PC de 2011 est souvent un portable ; retirer le sans-fil casserait la cible.
# WITHOUT_CLANG / WITHOUT_LLDB : NON appliqués pour l'instant.
#   Retirer le compilateur de la base est une décision lourde (auto-compilation,
#   correctifs) qui exige un essai réel — pas une supposition.
# ZFS : conservé dans le monde, même si L1 utilise UFS (ADR-0009).
