# NexBSD — src.conf (candidat)
# ---------------------------------------------------------------------------
# STATUT : [PROPOSITION] — AUCUN BUILD RÉEL N'A ÉTÉ EFFECTUÉ AVEC CE FICHIER.
# Chaque ligne doit être validée par une construction, puis par un démarrage
# réel. Une option inconnue ou mal comprise peut produire un système qui
# compile mais ne démarre pas.
#
# Objet : ne PAS écrire le système à la main, mais RETIRER le superflu.
# Principe : on retire, on n'ajoute pas. Ce qui n'est pas listé reste par défaut.
# ---------------------------------------------------------------------------

# --- Documentation et exemples embarqués : inutiles sur un PC faible ---
WITHOUT_TESTS=yes
WITHOUT_EXAMPLES=yes
WITHOUT_GAMES=yes
WITHOUT_DOCS=yes

# --- Éléments de développement : absents d'une image de production ---
WITHOUT_PROFILE=yes
WITHOUT_DEBUG_FILES=yes

# --- Éléments historiques / rarement nécessaires en 2026 ---
WITHOUT_SENDMAIL=yes
WITHOUT_TELNET=yes
WITHOUT_FLOPPY=yes
WITHOUT_VI=no

# --- NE PAS TOUCHER (sinon le build casse ou le système devient instable) ---
# WITHOUT_CLANG / WITHOUT_LLD : casse la construction elle-même.
# WITHOUT_DVD / WITHOUT_CD : sans objet pour une image memstick.
# Les options liées à OpenSSL, libc, rtld : jamais modifiées par un projet
# de cette taille (surface de sécurité et compatibilité).
